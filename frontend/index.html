<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Catalog</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 and ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = window.location.origin;

    function App() {
      const [books, setBooks] = useState([]);
      const [authors, setAuthors] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [genreFilter, setGenreFilter] = useState("");
      const [availabilityFilter, setAvailabilityFilter] = useState("");
      const [page, setPage] = useState(0);
      const limit = 8;
      const [message, setMessage] = useState(null);
      const [showAddBook, setShowAddBook] = useState(false);
      const [showAddAuthor, setShowAddAuthor] = useState(false);

      // Fetch authors for dropdowns
      const fetchAuthors = async () => {
        try {
          const res = await fetch(`${API_BASE}/authors?limit=100`);
          if (res.ok) {
            const data = await res.json();
            setAuthors(data);
          }
        } catch (err) {
          console.error("Failed to load authors:", err);
        }
      };

      // Fetch books with filters, search, or pagination
      const fetchBooks = async () => {
        setLoading(true);
        try {
          let url = "";
          const offset = page * limit;

          if (searchQuery.trim()) {
            url = `${API_BASE}/books/search?q=${encodeURIComponent(searchQuery.trim())}&limit=${limit}&offset=${offset}`;
          } else {
            const params = new URLSearchParams({ limit, offset });
            if (genreFilter) params.append("genre", genreFilter);
            if (availabilityFilter !== "") params.append("available", availabilityFilter);
            url = `${API_BASE}/books?${params.toString()}`;
          }

          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            setBooks(data);
          } else {
            const err = await res.json();
            setMessage({ type: "error", text: err.detail || "Error loading books" });
          }
        } catch (err) {
          setMessage({ type: "error", text: "Network error connecting to API" });
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchAuthors();
      }, []);

      useEffect(() => {
        fetchBooks();
      }, [page, genreFilter, availabilityFilter]);

      const handleSearch = (e) => {
        e.preventDefault();
        setPage(0);
        fetchBooks();
      };

      const handleCheckout = async (bookId) => {
        try {
          const res = await fetch(`${API_BASE}/books/${bookId}/checkout`, { method: "POST" });
          const data = await res.json();
          if (res.ok) {
            setMessage({ type: "success", text: `Book checked out successfully!` });
            fetchBooks();
          } else {
            setMessage({ type: "error", text: data.detail || "Checkout failed" });
          }
        } catch (err) {
          setMessage({ type: "error", text: "Failed to checkout book" });
        }
      };

      const handleReturn = async (bookId) => {
        try {
          const res = await fetch(`${API_BASE}/books/${bookId}/return`, { method: "POST" });
          const data = await res.json();
          if (res.ok) {
            setMessage({ type: "success", text: `Book returned successfully!` });
            fetchBooks();
          } else {
            setMessage({ type: "error", text: data.detail || "Return failed" });
          }
        } catch (err) {
          setMessage({ type: "error", text: "Failed to return book" });
        }
      };

      const genres = ["Fiction", "Sci-Fi", "Dystopian", "Fantasy", "Classic", "History", "Mystery"];

      return (
        <div class="max-w-7xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-200 mb-8 gap-4">
            <div>
              <h1 class="text-3xl font-extrabold text-indigo-900 flex items-center gap-3">
                <i class="fa-solid fa-book-bookmark text-indigo-600"></i> Library Catalog
              </h1>
              <p class="text-slate-500 text-sm mt-1">Browse, search, and manage books and authors</p>
            </div>
            <div class="flex gap-3">
              <button
                onClick={() => setShowAddAuthor(true)}
                class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm transition font-medium flex items-center gap-2"
              >
                <i class="fa-solid fa-user-plus text-indigo-600"></i> Add Author
              </button>
              <button
                onClick={() => setShowAddBook(true)}
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm transition font-medium flex items-center gap-2"
              >
                <i class="fa-solid fa-plus"></i> Add Book
              </button>
            </div>
          </header>

          {/* Flash Alert */}
          {message && (
            <div class={`p-4 rounded-lg mb-6 flex justify-between items-center ${
              message.type === "success" ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-rose-50 text-rose-800 border border-rose-200"
            }`}>
              <div class="flex items-center gap-2">
                <i class={`fa-solid ${message.type === "success" ? "fa-circle-check text-emerald-500" : "fa-triangle-exclamation text-rose-500"}`}></i>
                <span>{message.text}</span>
              </div>
              <button onClick={() => setMessage(null)} class="text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          )}

          {/* Search & Filter Toolbar */}
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-8 space-y-4">
            <form onSubmit={handleSearch} class="flex flex-col sm:flex-row gap-3">
              <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                <input
                  type="text"
                  placeholder="Search books by title or author name..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                />
              </div>
              <button
                type="submit"
                class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-medium transition"
              >
                Search
              </button>
              {searchQuery && (
                <button
                  type="button"
                  onClick={() => { setSearchQuery(""); setPage(0); fetchBooks(); }}
                  class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-medium transition"
                >
                  Clear
                </button>
              )}
            </form>

            <div class="flex flex-wrap gap-4 pt-2 border-t border-slate-100 text-sm">
              <div class="flex items-center gap-2">
                <span class="text-slate-500 font-medium">Genre:</span>
                <select
                  value={genreFilter}
                  onChange={(e) => { setGenreFilter(e.target.value); setPage(0); }}
                  class="border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">All Genres</option>
                  {genres.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </div>

              <div class="flex items-center gap-2">
                <span class="text-slate-500 font-medium">Availability:</span>
                <select
                  value={availabilityFilter}
                  onChange={(e) => { setAvailabilityFilter(e.target.value); setPage(0); }}
                  class="border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">All Statuses</option>
                  <option value="true">Available</option>
                  <option value="false">Checked Out</option>
                </select>
              </div>
            </div>
          </div>

          {/* Catalog Grid */}
          {loading ? (
            <div class="text-center py-20 text-slate-400">
              <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
              <p>Loading books from database...</p>
            </div>
          ) : books.length === 0 ? (
            <div class="text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
              <i class="fa-solid fa-book-open text-4xl text-slate-300 mb-3"></i>
              <p class="text-slate-600 font-medium">No books found in the catalog.</p>
              <p class="text-slate-400 text-sm mt-1">Try adjusting your search or filters.</p>
            </div>
          ) : (
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
              {books.map((book) => (
                <div key={book.id} class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start gap-2 mb-2">
                      <span class="text-xs uppercase tracking-wide font-semibold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">
                        {book.genre}
                      </span>
                      <span class={`text-xs font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1 ${
                        book.available ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"
                      }`}>
                        <span class={`w-1.5 h-1.5 rounded-full ${book.available ? "bg-emerald-500" : "bg-amber-500"}`}></span>
                        {book.available ? "Available" : "Checked Out"}
                      </span>
                    </div>

                    <h3 class="font-bold text-lg text-slate-900 line-clamp-2 mt-1">{book.title}</h3>
                    
                    <p class="text-sm text-slate-500 mt-2">
                      <i class="fa-solid fa-feather text-slate-400 mr-1"></i>
                      {book.authors && book.authors.length > 0 
                        ? book.authors.map(a => `${a.first_name} ${a.last_name}`).join(", ")
                        : "Unknown Author"}
                    </p>

                    <div class="text-xs text-slate-400 mt-3 flex justify-between">
                      <span>ISBN: {book.isbn}</span>
                      {book.publication_year && <span>{book.publication_year}</span>}
                    </div>
                  </div>

                  <div class="mt-5 pt-4 border-t border-slate-100 flex gap-2">
                    {book.available ? (
                      <button
                        onClick={() => handleCheckout(book.id)}
                        class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-sm rounded-lg transition"
                      >
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Check Out
                      </button>
                    ) : (
                      <button
                        onClick={() => handleReturn(book.id)}
                        class="w-full py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium text-sm rounded-lg transition"
                      >
                        <i class="fa-solid fa-arrow-right-to-bracket mr-1"></i> Return Book
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Pagination Toolbar */}
          <div class="flex items-center justify-between border-t border-slate-200 pt-6">
            <button
              disabled={page === 0}
              onClick={() => setPage(p => Math.max(0, p - 1))}
              class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50"
            >
              <i class="fa-solid fa-chevron-left mr-1"></i> Previous
            </button>
            <span class="text-sm text-slate-500">Page {page + 1}</span>
            <button
              disabled={books.length < limit}
              onClick={() => setPage(p => p + 1)}
              class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50"
            >
              Next <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
          </div>

          {/* Add Book Modal */}
          {showAddBook && (
            <AddBookModal
              authors={authors}
              onClose={() => setShowAddBook(false)}
              onSuccess={() => {
                setShowAddBook(false);
                setMessage({ type: "success", text: "Book created successfully!" });
                fetchBooks();
              }}
            />
          )}

          {/* Add Author Modal */}
          {showAddAuthor && (
            <AddAuthorModal
              onClose={() => setShowAddAuthor(false)}
              onSuccess={() => {
                setShowAddAuthor(false);
                setMessage({ type: "success", text: "Author created successfully!" });
                fetchAuthors();
              }}
            />
          )}
        </div>
      );
    }

    function AddBookModal({ authors, onClose, onSuccess }) {
      const [title, setTitle] = useState("");
      const [isbn, setIsbn] = useState("");
      const [genre, setGenre] = useState("Fiction");
      const [year, setYear] = useState(new Date().getFullYear());
      const [selectedAuthors, setSelectedAuthors] = useState([]);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (selectedAuthors.length === 0) {
          setError("Please select at least one author.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/books`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title,
              isbn,
              genre,
              publication_year: parseInt(year, 10),
              author_ids: selectedAuthors.map(Number),
            }),
          });
          const data = await res.json();
          if (res.ok) {
            onSuccess();
          } else {
            setError(data.detail || "Failed to create book");
          }
        } catch (err) {
          setError("Network error creating book");
        }
      };

      return (
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Add New Book</h2>
            {error && <div class="p-3 mb-4 rounded bg-rose-50 text-rose-700 text-sm">{error}</div>}
            <form onSubmit={handleSubmit} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Title</label>
                <input required class="w-full border rounded-lg px-3 py-2 text-sm" value={title} onChange={e => setTitle(e.target.value)} />
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">ISBN</label>
                <input required class="w-full border rounded-lg px-3 py-2 text-sm" value={isbn} onChange={e => setIsbn(e.target.value)} placeholder="978..." />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Genre</label>
                  <input required class="w-full border rounded-lg px-3 py-2 text-sm" value={genre} onChange={e => setGenre(e.target.value)} />
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Year</label>
                  <input type="number" class="w-full border rounded-lg px-3 py-2 text-sm" value={year} onChange={e => setYear(e.target.value)} />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Authors (Ctrl+Click to select multiple)</label>
                <select
                  multiple
                  required
                  class="w-full border rounded-lg p-2 text-sm h-28"
                  value={selectedAuthors}
                  onChange={e => setSelectedAuthors(Array.from(e.target.selectedOptions, o => o.value))}
                >
                  {authors.map(a => (
                    <option key={a.id} value={a.id}>{a.first_name} {a.last_name}</option>
                  ))}
                </select>
              </div>
              <div class="flex justify-end gap-2 pt-3">
                <button type="button" onClick={onClose} class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save Book</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AddAuthorModal({ onClose, onSuccess }) {
      const [firstName, setFirstName] = useState("");
      const [lastName, setLastName] = useState("");
      const [nationality, setNationality] = useState("");
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/authors`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ first_name: firstName, last_name: lastName, nationality }),
          });
          const data = await res.json();
          if (res.ok) {
            onSuccess();
          } else {
            setError(data.detail || "Failed to create author");
          }
        } catch (err) {
          setError("Network error creating author");
        }
      };

      return (
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Add New Author</h2>
            {error && <div class="p-3 mb-4 rounded bg-rose-50 text-rose-700 text-sm">{error}</div>}
            <form onSubmit={handleSubmit} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">First Name</label>
                <input required class="w-full border rounded-lg px-3 py-2 text-sm" value={firstName} onChange={e => setFirstName(e.target.value)} />
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Last Name</label>
                <input required class="w-full border rounded-lg px-3 py-2 text-sm" value={lastName} onChange={e => setLastName(e.target.value)} />
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nationality</label>
                <input class="w-full border rounded-lg px-3 py-2 text-sm" value={nationality} onChange={e => setNationality(e.target.value)} placeholder="e.g. British" />
              </div>
              <div class="flex justify-end gap-2 pt-3">
                <button type="button" onClick={onClose} class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save Author</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
